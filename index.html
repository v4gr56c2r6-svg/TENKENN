<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14263d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TENKEN PRO">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>TENKEN PRO</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">STORE OPERATIONS</p>
      <h1>TENKEN <span>PRO</span></h1>
    </div>
    <div class="date-chip" id="todayLabel"></div>
  </header>

  <main>
    <section class="welcome">
      <div>
        <p class="eyebrow light">DAILY CHECK</p>
        <h2>今日の点検</h2>
        <p class="muted-light">清潔で安全な店舗づくりを。</p>
      </div>
      <div class="progress-ring" id="progressRing"><strong id="progressPercent">0%</strong><small>完了</small></div>
    </section>

    <section class="stats">
      <article class="stat-card"><span>全項目</span><strong id="totalCount">0</strong></article>
      <article class="stat-card"><span>完了</span><strong id="doneCount">0</strong></article>
      <article class="stat-card"><span>要対応</span><strong id="issueCount">0</strong></article>
    </section>

    <section class="panel staff-panel">
      <label for="staffName">点検担当者</label>
      <input id="staffName" type="text" maxlength="30" placeholder="スタッフ名を入力">
      <p class="hint">この端末に担当者名を保存します。</p>
    </section>

    <section class="section-head">
      <div><p class="eyebrow">CHECKLIST</p><h2>点検項目</h2></div>
      <button class="text-button" id="resetTodayBtn" type="button">今日の記録をリセット</button>
    </section>

    <div id="checklist"></div>

    <section class="panel add-panel">
      <h3>点検項目を追加</h3>
      <form id="addForm">
        <input id="newItemName" type="text" maxlength="60" placeholder="例：冷蔵庫の温度確認" required>
        <select id="newItemCategory" aria-label="カテゴリ">
          <option value="清掃">清掃</option>
          <option value="設備">設備</option>
        </select>
        <button class="primary-btn" type="submit">追加する</button>
      </form>
    </section>

    <section class="panel history-panel">
      <div class="section-head compact"><div><p class="eyebrow">RECORDS</p><h2>最近の点検履歴</h2></div></div>
      <div id="historyList" class="history-list"><p class="empty">まだ点検履歴はありません。</p></div>
    </section>

    <section class="panel backup-panel">
      <h3>データ管理</h3>
      <p class="hint">機種変更やデータ保全のため、定期的にバックアップしてください。</p>
      <div class="button-row">
        <button class="secondary-btn" id="exportBtn" type="button">バックアップを書き出す</button>
        <label class="secondary-btn file-label">バックアップを復元<input id="importFile" type="file" accept="application/json"></label>
      </div>
    </section>
  </main>

  <footer> TENKEN PRO <span>STORE CHECK SYSTEM</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
