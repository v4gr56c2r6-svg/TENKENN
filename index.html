<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14263d"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>TENKEN PRO</title></head><body>
<section id="loginScreen" class="login"><div class="card"><h1>TENKEN <span>PRO</span></h1><h2>スタッフログイン</h2><form id="loginForm"><label>スタッフID<input id="staffId" type="text" required maxlength="40" autocomplete="username" placeholder="例：manager001"></label><label>パスワード<input id="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><p id="loginError" class="error"></p><small>アカウントは管理者が発行します。</small></div></section>
<div id="app" hidden><header><h1>TENKEN <span>PRO</span></h1><div><span id="who"></span> <button id="logout">ログアウト</button></div></header><main><section class="hero"><h2>今日の点検</h2><b id="percent">0%</b></section><p id="sync">クラウド接続中…</p><section class="stats"><div>全項目<strong id="total">0</strong></div><div>完了<strong id="done">0</strong></div><div>要対応<strong id="ng">0</strong></div></section><section class="card"><h3>点検項目</h3><div id="checklist"></div><button id="reset">今日の記録をリセット</button></section><section class="card" id="adminPanel"><h3>点検項目を追加（管理者）</h3><form id="addForm"><input id="itemName" placeholder="点検項目名" required><select id="category"><option>清掃</option><option>設備</option></select><button>追加</button></form></section><section class="card"><h3>異常報告</h3><form id="reportForm"><label>タイトル<input id="title" required maxlength="60"></label><label>分類<select id="reportCategory"><option>清掃</option><option>設備</option><option>その他</option></select></label><label>緊急度<select id="urgency"><option>通常</option><option>要確認</option><option>緊急</option></select></label><label>状況・対応メモ<textarea id="description" maxlength="1000"></textarea></label><label>写真（任意・この端末のみ）<input id="photo" type="file" accept="image/*" capture="environment"></label><small>写真は端末内のみ。クラウドには文章だけ共有されます。</small><button>異常報告を保存・共有</button></form><div id="reports"></div></section><section class="card"><h3>最近の点検履歴</h3><div id="history"></div></section><section class="card"><h3>データ管理</h3><button id="export">クラウドデータを書き出す</button><label class="file">旧バックアップを移行（管理者のみ）<input id="import" type="file" accept="application/json"></label><small>過去の写真は移行されません。</small></section></main></div><div id="toast"></div><script type="module" src="app.js"></script></body></html>
